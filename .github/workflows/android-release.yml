name: Build & Publish Android Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0-debug'
      release_name:
        description: 'Release Title'
        required: false
        default: 'New Android Debug Build'

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases

    steps:
      - uses: actions/checkout@v4
      
      # 1. Setup Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true
          
      # 2. Quality Gate (Test & Lint)
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint Code
        run: npm run lint
        
      - name: Run Unit Tests
        run: npm test
        
      # 3. Build Web Assets
      - name: Build Web App
        run: npm run build
        
      # 4. Android Build
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.keystore

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew
        
      - name: Build Release App Bundle & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          
      # 5. Rename & Prepare Artifacts
      - name: Prepare Artifacts
        run: |
          mv android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/bundle/release/wod-gen-${{ github.event.inputs.tag_name }}.aab
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/wod-gen-${{ github.event.inputs.tag_name }}.apk
          
      # 6. Create Release & Upload
      - name: Create Release & Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/bundle/release/wod-gen-${{ github.event.inputs.tag_name }}.aab
            android/app/build/outputs/apk/release/wod-gen-${{ github.event.inputs.tag_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
