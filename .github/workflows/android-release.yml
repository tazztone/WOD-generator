name: Build & Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name (leave empty to use package.json version)'
        required: false
      release_name:
        description: 'Release Title (leave empty for default)'
        required: false

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      # 0. Determine Versioning
      - name: Set Version Variables
        id: vars
        run: |
          # 1. Get version from package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          # 2. Determine TAG
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="v${PKG_VERSION}-build.${{ github.run_number }}"
          fi
          
          # 3. Determine RELEASE TITLE
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            RELEASE_TITLE="${{ github.event.inputs.release_name }}"
          else
            RELEASE_TITLE="Release ${TAG_NAME}"
          fi
          
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "Using Tag: $TAG_NAME"
          echo "Using Title: $RELEASE_TITLE"
      
      # 1. Setup Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true
          
      # 2. Quality Gate (Test & Lint)
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint Code
        run: npm run lint
        
      - name: Run Unit Tests
        run: npm test
        
      # 3. Build Web Assets
      - name: Build Web App
        run: npm run build
        
      # 4. Android Build
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.keystore

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew
        
      - name: Build Release App Bundle & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          
      # 5. Rename & Prepare Artifacts
      - name: Prepare Artifacts
        run: |
          mv android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/bundle/release/wod-gen-${{ steps.vars.outputs.tag }}.aab
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/wod-gen-${{ steps.vars.outputs.tag }}.apk
          
      # 6. Create Release & Upload
      - name: Create Release & Upload Artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/bundle/release/wod-gen-${{ steps.vars.outputs.tag }}.aab
            android/app/build/outputs/apk/release/wod-gen-${{ steps.vars.outputs.tag }}.apk
            android/app/build/outputs/mapping/release/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
