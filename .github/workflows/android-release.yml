# GitHub Action: Build & Publish Android Release to GitHub and Google Play Store
# 
# Required Secrets:
# - ANDROID_KEYSTORE_BASE64: Base64-encoded keystore file
# - ANDROID_KEYSTORE_PASSWORD: Keystore password
# - ANDROID_KEY_ALIAS: Key alias
# - ANDROID_KEY_PASSWORD: Key password
# - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: Google Play Service Account JSON (for Play Store upload)
#
# Trigger: Push tags starting with 'v' or manual workflow_dispatch

name: Build & Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name (leave empty to use package.json version)'
        required: false
      release_name:
        description: 'Release Title (leave empty for default)'
        required: false
      publish_to_play_store:
        description: 'Publish to Play Store'
        type: boolean
        default: true
        required: false

jobs:
  build-and-release:
    name: Build APK/AAB & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      
      # 0. Determine Versioning
      - name: Set Version Variables
        id: vars
        run: |
          # 1. Get version from package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          # 2. Determine TAG
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="v${PKG_VERSION}-build.${{ github.run_number }}"
          fi
          
          # 3. Determine RELEASE TITLE
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            RELEASE_TITLE="${{ github.event.inputs.release_name }}"
          else
            RELEASE_TITLE="Release ${TAG_NAME}"
          fi
          
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "Using Tag: $TAG_NAME"
          echo "Using Title: $RELEASE_TITLE"
      
      # 1. Setup Environment
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          
      # 2. Quality Gate (Test & Lint)
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint Code
        run: npm run lint
        
      - name: Run Unit Tests
        run: npm test
        
      # 3. Build Web Assets
      - name: Build Web App
        run: npm run build
        
      # 4. Android Build
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.keystore

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew
        
      - name: Build Release App Bundle & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          
      # 5. Rename & Prepare Artifacts
      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab release-artifacts/wod-gen-${{ steps.vars.outputs.tag }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk release-artifacts/wod-gen-${{ steps.vars.outputs.tag }}.apk
          cp android/app/build/outputs/mapping/release/mapping.txt release-artifacts/mapping-${{ steps.vars.outputs.tag }}.txt
          
      # 6. Create GitHub Release & Upload Artifacts
      - name: Create GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/wod-gen-${{ steps.vars.outputs.tag }}.aab
            release-artifacts/wod-gen-${{ steps.vars.outputs.tag }}.apk
            release-artifacts/mapping-${{ steps.vars.outputs.tag }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Publish to Google Play Store (Production Track)
      - name: Publish to Google Play Store
        if: ${{ github.event.inputs.publish_to_play_store != 'false' }}
        uses: r0adkll/upload-google-play@v1 # Still on v1 as per search
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.wodgen.ultimate
          releaseFiles: release-artifacts/wod-gen-${{ steps.vars.outputs.tag }}.aab
          track: internal
          mappingFile: release-artifacts/mapping-${{ steps.vars.outputs.tag }}.txt
          status: completed
